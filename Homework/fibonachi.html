<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фибоначчи</title>
</head>
<body>
    <h1>Числа Фибоначчи</h1>

    <h2>Введите до какого числа выводить ряд</h2>
    <input id="number1" type="number" value="50">
    <button id="button">Показать</button>
    <div id="result1" style="margin-top:10px; font-size:18px;"></div>

    <h2>Введите сколько чисел нужно вывести</h2>
    <input id="countInput" type="number" value="10" min="1">
    <button onclick="showFibonachi()">Вывести</button>
    <div id="result2" style="margin-top:10px; font-size:18px;"></div>

    <script src="fibonachi.js"></script>
</body>
</html>
