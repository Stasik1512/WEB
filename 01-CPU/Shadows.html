<!DOCTYPE html>

<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Shadows</title>
	<style>
		body
		{
			display: flex;
			/*background-image: radial-gradient(circle,#7a9e7e,#d4c84a 20%,#e8896a 80%);*/
			background-image: conic-gradient(from 35deg, #7a9e7e,  55deg,#d4c84a,#e8896a, #7a9e7e);
			
			background-attachment: fixed;
		}
		.shadow-box-1, .shadow-box-2 
		{
			width:256px;
			height:256px;
			border:solid 1px;
			margin: 200px auto;
		}
		.shadow-box-1 /*hover при наведениии мышью*/
		{
			box-shadow: 
				-50px	-50px	50px	0px		green,
				 50px	 50px	50px	0px		blue,
				-100px	 100px	50px	0px		red;
		}
		.shadow-box-2
		{
			border: solid 5px slategray;
			box-shadow: 0px 0px 0px 30px white;
			border-radius: 128px;
			/*radial-gradient(#e8896a,#d4c84a 80%)*/
			background-image: conic-gradient(white 0deg, white 90deg, darkblue 90deg,darkblue 180deg, white 180deg, white 270deg, darkblue 270deg, darkblue 360deg);
		}
		.shadow-box-1 ~ .shadow-box-2
		{
			box-shadow: inset 50px 50px 50px 0px red,
						inset -50px -50px 50px 0px green; /*inset- тень во внутрь*/
		}
		.shadow-box-1 .shadow-box-2
		{
			width: 64px;
			height: 64px;
			margin: 50px auto;
			box-shadow: 
				inset 5px 5px 5px 5px red,
				inset -5px -5px 5px 5px green;
		}
	</style>
</head>
<body>
	<h1>Shadows</h1>
	<div class="shadow-box-2"></div>
	<div class="shadow-box-1">
		<div>
			<div class="shadow-box-2"></div>
		</div>
	</div>


	<div class="shadow-box-2"></div>

	
</body>
</html>
